# Reference only: not applied by default.
# Replace the repository and revision with a reviewed, immutable release before use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: archnet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/EdwinJdevops/ARCHNET.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
