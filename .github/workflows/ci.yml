name: Archnet validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate YAML syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python - <<'PY'
          from pathlib import Path
          import yaml
          paths = sorted([*Path('.').rglob('*.yaml'), *Path('.').rglob('*.yml')])
          if not paths:
              raise SystemExit('No YAML files found')
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  list(yaml.safe_load_all(stream))
              print('Parsed:', path)
          PY

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: Validate required directories
        shell: bash
        run: |
          set -euo pipefail
          for dir in terraform argocd observability apps docs k3s; do
            test -d "$dir" || { echo "Missing: $dir" >&2; exit 1; }
          done

      - name: Test infrastructure safety guard
        run: python -m unittest discover -s tests -v

      - name: Verify cloud deployment safety lock
        run: python scripts/check_cloud_lock.py

      - name: Deny public SSH and Kubernetes API ingress
        run: python scripts/check_infrastructure_safety.py

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Initialize without remote backend
        working-directory: terraform
        run: terraform init -backend=false -input=false
      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive -diff
      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate -no-color

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: '1'
